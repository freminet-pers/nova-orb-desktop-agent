<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qrc:; style-src 'self' 'unsafe-inline'; connect-src 'none'">
  <link rel="stylesheet" href="nova.css">
</head>
<body>
<canvas id="nova-canvas" width="220" height="220" aria-hidden="true"></canvas>
<svg id="nova" viewBox="0 0 220 220" role="img" aria-label="Nova 桌面助理；双击设置，拖动移动，右键菜单">
  <defs>
    <linearGradient id="body-gradient" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#202633"/>
      <stop offset="0.48" stop-color="#171c25"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <radialGradient id="sheen-gradient" cx="28%" cy="19%" r="74%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="0.32" stop-color="#8fc7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8fc7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="highlight-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6ecff" stop-opacity="0.38"/>
      <stop offset="0.24" stop-color="#85bdff" stop-opacity="0.08"/>
      <stop offset="0.58" stop-color="#85bdff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="environment-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65d7b0" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#65d7b0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#65d7b0" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="lens-gradient" cx="30%" cy="22%" r="90%">
      <stop offset="0" stop-color="#e5f4ff"/>
      <stop offset="0.18" stop-color="#8cc8ff"/>
      <stop offset="0.68" stop-color="#3b79bc"/>
      <stop offset="1" stop-color="#1a355b"/>
    </radialGradient>
    <filter id="shadow-filter" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="3.6"/>
    </filter>
    <filter id="glow-filter" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.8"/>
    </filter>
  </defs>

  <g id="bot">
    <ellipse id="contact-shadow" cx="110" cy="194" rx="61" ry="7"/>

    <g id="orbit-back" opacity="0">
      <ellipse class="nova-orbit" cx="110" cy="111" rx="94" ry="43" transform="rotate(-18 110 111)" stroke-width="1.5" stroke-dasharray="3 10"/>
      <circle class="nova-orbit-node" cx="29" cy="94" r="1.8"/>
      <circle class="nova-orbit-node" cx="184" cy="132" r="1.4"/>
    </g>

    <g id="body-group">
      <path id="body-base" d="M110 28 C139 29 168 51 188 82 C194 112 185 145 169 178 C145 195 116 199 88 191 C57 183 39 158 35 128 C28 96 43 67 65 47 C79 35 95 30 110 28 Z"/>
      <path id="body-sheen" d="M110 28 C139 29 168 51 188 82 C194 112 185 145 169 178 C145 195 116 199 88 191 C57 183 39 158 35 128 C28 96 43 67 65 47 C79 35 95 30 110 28 Z"/>
      <path id="body-highlight" d="M64 53 C77 38 102 31 125 35 C101 52 84 72 78 101 C72 125 54 127 44 113 C42 91 49 68 64 53 Z"/>
      <path id="body-environment" d="M42 145 C67 171 104 183 142 177 C156 175 169 168 180 157 C174 178 159 190 141 196 C114 202 80 191 61 179 C50 171 43 159 42 145 Z"/>
      <path id="body-rim" d="M110 28 C139 29 168 51 188 82 C194 112 185 145 169 178 C145 195 116 199 88 191 C57 183 39 158 35 128 C28 96 43 67 65 47 C79 35 95 30 110 28 Z"/>

      <g id="face">
        <g id="eye-left" class="nova-eye">
          <path class="nova-eye-lens" d="M-20 0 C-20 -10 -12 -15 0 -15 C12 -15 20 -10 20 0 C20 10 12 15 0 15 C-12 15 -20 10 -20 0 Z"/>
          <path class="nova-eye-rim" d="M-17 -2 C-12 -11 -4 -12 5 -11 C12 -10 17 -5 18 0"/>
          <circle class="nova-pupil" cx="0" cy="0" r="6.1"/>
          <circle class="nova-glint" cx="-2.2" cy="-2.7" r="1.65"/>
          <circle class="nova-glint" cx="3.7" cy="3.4" r="0.72" opacity="0.76"/>
          <path class="nova-lid" d="M-18 -1 Q0 -11 18 -1"/>
        </g>
        <g id="eye-right" class="nova-eye">
          <path class="nova-eye-lens" d="M-20 0 C-20 -10 -12 -15 0 -15 C12 -15 20 -10 20 0 C20 10 12 15 0 15 C-12 15 -20 10 -20 0 Z"/>
          <path class="nova-eye-rim" d="M-17 -2 C-12 -11 -4 -12 5 -11 C12 -10 17 -5 18 0"/>
          <circle class="nova-pupil" cx="0" cy="0" r="6.1"/>
          <circle class="nova-glint" cx="-2.2" cy="-2.7" r="1.65"/>
          <circle class="nova-glint" cx="3.7" cy="3.4" r="0.72" opacity="0.76"/>
          <path class="nova-lid" d="M-18 -1 Q0 -11 18 -1"/>
        </g>
      </g>
    </g>

    <g id="orbit-front" opacity="0">
      <ellipse class="nova-orbit" cx="110" cy="111" rx="94" ry="43" transform="rotate(-18 110 111)" stroke-width="1.9" stroke-dasharray="24 92"/>
      <circle class="nova-orbit-node" cx="174" cy="84" r="2.2"/>
      <circle class="nova-orbit-node" cx="78" cy="151" r="1.2"/>
    </g>

    <g id="particles" aria-hidden="true">
      <circle class="nova-particle" cx="33" cy="67" r="1.1"/>
      <circle class="nova-particle" cx="195" cy="78" r="1.2"/>
      <circle class="nova-particle" cx="31" cy="151" r="0.9"/>
      <circle class="nova-particle" cx="186" cy="170" r="1.1"/>
      <circle class="nova-particle" cx="62" cy="35" r="0.8"/>
      <circle class="nova-particle" cx="154" cy="27" r="0.9"/>
      <circle class="nova-particle" cx="51" cy="188" r="0.8"/>
      <circle class="nova-particle" cx="167" cy="197" r="0.8"/>
    </g>
    <path id="status-mark" d="M110 143 V153 M110 159 V159.5"/>
  </g>
</svg>

<script src="nova_states.js"></script>
<script src="nova_renderer.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="nova_bridge.js"></script>
</body>
</html>
